<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="flight-title flight-desc">
<title id="flight-title">Aakash Agrawal — Flight Recorder</title>
<desc id="flight-desc">A compact live research instrument showing four public systems, three deliberately unnamed private programs, and four research axes.</desc>
<defs>
<pattern id="dark-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#18201e" stroke-width="0.7"/></pattern>
<pattern id="paper-grid" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.6" fill="#c8c4ba" opacity="0.7"/></pattern>
<style>
      .display { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.7px; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .white { fill: #f5f5f2; }
      .muted { fill: #9aa6a2; }
      .ink { fill: #111514; }
      .paper-muted { fill: #5f625e; }
      .mint { fill: #5ef2b2; }
      .red { fill: #f0442e; }
      .amber { fill: #d8a633; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .label { font-size: 15px; font-weight: 650; letter-spacing: 1.15px; }
      .micro { font-size: 13px; font-weight: 550; letter-spacing: .65px; }
      .body { font-size: 18px; }
      .signal { stroke-dasharray: 7 12; animation: signal-flow 12s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: live-pulse 2.4s ease-in-out infinite; }
      @keyframes signal-flow { to { stroke-dashoffset: -190; } }
      @keyframes live-pulse { 0%, 100% { opacity: .55; transform: scale(.84); } 50% { opacity: 1; transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) {
        .signal, .pulse { animation: none !important; }
      }
    </style>
</defs>
<rect width="1200" height="420" fill="#060909"/>
<rect width="1200" height="420" fill="url(#dark-grid)" opacity="0.5"/>
<rect y="420" width="1200" height="200" fill="#f2f0e9"/>
<rect x="950" y="440" width="220" height="150" fill="url(#paper-grid)" opacity="0.54"/>
<line x1="28" y1="48" x2="1172" y2="48" stroke="#35403d"/>
<text x="30" y="32" class="mono eyebrow white">AA / FLIGHT RECORDER / V2</text>
<circle cx="1159" cy="27" r="6" fill="#5ef2b2" class="pulse"/>
<text x="1142" y="33" class="mono eyebrow mint" text-anchor="end">LIVE</text>
<text x="30" y="115" class="display white" font-size="58">AAKASH AGRAWAL</text>
<text x="33" y="153" class="mono body white">Building the trust layer,</text>
<text x="33" y="180" class="mono body white">the delegations, and the</text>
<text x="33" y="207" class="mono body white">instruments to see farther.</text>
<text x="32" y="270" class="mono label muted">CURRENT THESIS</text>
<line x1="32" y1="284" x2="478" y2="284" stroke="#35403d"/>
<text x="32" y="319" class="mono label mint">TRUST → DELEGATION → VERIFIABLE OUTCOMES</text>
<text x="32" y="353" class="sans body white">Private by default. Public where proof helps.</text>
<text x="650" y="84" class="mono label muted">LIVE SYSTEMS</text>
<line x1="625" y1="101" x2="625" y2="376" stroke="#5ef2b2" opacity="0.78"/>
<line x1="625" y1="101" x2="625" y2="376" stroke="#5ef2b2" stroke-width="2" class="signal"/>
<ellipse cx="892" cy="230" rx="238" ry="140" fill="none" stroke="#33403d"/>
<ellipse cx="892" cy="230" rx="166" ry="96" fill="none" stroke="#25302e" stroke-dasharray="4 8"/>
<circle cx="892" cy="230" r="8" fill="#060909" stroke="#7c8884"/>
<circle cx="892" cy="230" r="2.5" fill="#f5f5f2"/>
<circle cx="625" cy="121" r="5" fill="#5ef2b2"/>
<line x1="630" y1="121" x2="662" y2="121" stroke="#5ef2b2"/>
<text x="680" y="126" class="sans body white">MESHERRA</text>
<text x="1166" y="126" class="mono micro mint" text-anchor="end">1MO AGO</text>
<text x="680" y="148" class="mono micro muted">TRUST LAYER</text>
<line x1="680" y1="160" x2="1168" y2="160" stroke="#2b3532"/>
<circle cx="625" cy="179" r="5" fill="#5ef2b2"/>
<line x1="630" y1="179" x2="662" y2="179" stroke="#5ef2b2"/>
<text x="680" y="184" class="sans body white">MESHYCAL</text>
<text x="1166" y="184" class="mono micro mint" text-anchor="end">2MO AGO</text>
<text x="680" y="206" class="mono micro muted">FIRST DELEGATION</text>
<line x1="680" y1="218" x2="1168" y2="218" stroke="#2b3532"/>
<circle cx="625" cy="237" r="5" fill="#5ef2b2"/>
<line x1="630" y1="237" x2="662" y2="237" stroke="#5ef2b2"/>
<text x="680" y="242" class="sans body white">CHRONICA</text>
<text x="1166" y="242" class="mono micro mint" text-anchor="end">5MO AGO</text>
<text x="680" y="264" class="mono micro muted">LIFE IN FRAMES</text>
<line x1="680" y1="276" x2="1168" y2="276" stroke="#2b3532"/>
<circle cx="625" cy="295" r="5" fill="#5ef2b2"/>
<line x1="630" y1="295" x2="662" y2="295" stroke="#5ef2b2"/>
<text x="680" y="300" class="sans body white">FUNDA</text>
<text x="1166" y="300" class="mono micro mint" text-anchor="end">4MO AGO</text>
<text x="680" y="322" class="mono micro muted">RESEARCH WORKBENCH</text>
<line x1="680" y1="334" x2="1168" y2="334" stroke="#2b3532"/>
<circle cx="625" cy="359" r="5" fill="#f0442e"/>
<line x1="630" y1="359" x2="662" y2="359" stroke="#f0442e" stroke-dasharray="3 5"/>
<text x="680" y="365" class="mono label red">03 PRIVATE PROGRAMS / ACTIVE</text>
<text x="1166" y="365" class="mono micro muted" text-anchor="end">WITHHELD BY DESIGN</text>
<line x1="28" y1="396" x2="1172" y2="396" stroke="#35403d"/>
<text x="30" y="414" class="mono micro muted">MODE  INDEPENDENT R&amp;D</text>
<text x="1170" y="414" class="mono micro mint" text-anchor="end">SYNC  2026.09.01</text>
<text x="30" y="454" class="mono label paper-muted">RESEARCH INDEX</text>
<text x="1170" y="454" class="mono micro ink" text-anchor="end">DISCLOSE THE QUESTION. PROTECT THE WORK.</text>
<text x="30" y="520" class="display ink" font-size="38">01</text>
<text x="88" y="516" class="sans label ink">TRUST</text>
<text x="88" y="548" class="mono micro paper-muted">Identity, scoped disclosure,</text>
<text x="88" y="566" class="mono micro paper-muted">provenance</text>
<line x1="30" y1="588" x2="290" y2="588" stroke="#a9a79f"/>
<line x1="302" y1="474" x2="302" y2="590" stroke="#b0ada4"/>
<text x="322" y="520" class="display ink" font-size="38">02</text>
<text x="380" y="516" class="sans label ink">DELEGATION</text>
<text x="380" y="548" class="mono micro paper-muted">Software that acts under bounded</text>
<text x="380" y="566" class="mono micro paper-muted">authority</text>
<line x1="322" y1="588" x2="582" y2="588" stroke="#a9a79f"/>
<line x1="594" y1="474" x2="594" y2="590" stroke="#b0ada4"/>
<text x="614" y="520" class="display ink" font-size="38">03</text>
<text x="672" y="516" class="sans label ink">COGNITION</text>
<text x="672" y="548" class="mono micro paper-muted">Memory, context, and temporal</text>
<text x="672" y="566" class="mono micro paper-muted">interfaces</text>
<line x1="614" y1="588" x2="874" y2="588" stroke="#a9a79f"/>
<line x1="886" y1="474" x2="886" y2="590" stroke="#b0ada4"/>
<text x="906" y="520" class="display ink" font-size="38">04</text>
<text x="964" y="516" class="sans label ink">LONG-HORIZON RESEARCH</text>
<text x="964" y="548" class="mono micro paper-muted">Instruments for decisions that</text>
<text x="964" y="566" class="mono micro paper-muted">compound</text>
<line x1="906" y1="588" x2="1166" y2="588" stroke="#a9a79f"/>
</svg>
