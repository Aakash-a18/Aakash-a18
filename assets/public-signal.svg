<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="188" viewBox="0 0 1200 188" role="img" aria-labelledby="signal-title signal-desc">
<title id="signal-title">Public signal</title>
<desc id="signal-desc">Recent push dates and public repository counts for four selected projects.</desc>
<style>
      .display { font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif; font-weight: 800; letter-spacing: 1px; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .white { fill: #f5f5f2; }
      .muted { fill: #8b9693; }
      .ink { fill: #111514; }
      .paper-muted { fill: #666965; }
      .mint { fill: #5ef2b2; }
      .red { fill: #f0442e; }
      .amber { fill: #d8a633; }
      .eyebrow { font-size: 13px; letter-spacing: 2.2px; }
      .label { font-size: 12px; letter-spacing: 1.4px; }
      .micro { font-size: 9px; letter-spacing: 1px; }
      .body { font-size: 14px; }
      .signal { stroke-dasharray: 7 12; animation: signal-flow 12s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: live-pulse 2.4s ease-in-out infinite; }
      @keyframes signal-flow { to { stroke-dashoffset: -190; } }
      @keyframes live-pulse { 0%, 100% { opacity: .55; transform: scale(.84); } 50% { opacity: 1; transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) {
        .signal, .pulse { animation: none !important; }
      }
    </style>
<rect width="1200" height="188" fill="#0a0d0d"/>
<line x1="24" y1="44" x2="1176" y2="44" stroke="#35403d"/>
<text x="26" y="29" class="mono eyebrow mint">PUBLIC SIGNAL / AUTO-REFRESHED</text>
<text x="1174" y="29" class="mono micro muted" text-anchor="end">SYNC 2026.08.17</text>
<text x="26" y="83" class="mono label white">01 / MESHERRA</text>
<text x="26" y="111" class="mono micro muted">LAST PUSH</text>
<text x="104" y="111" class="mono micro mint">1MO AGO</text>
<text x="26" y="134" class="mono micro muted">STARS</text>
<text x="104" y="134" class="mono micro white">0</text>
<text x="26" y="157" class="mono micro muted">LANGUAGE</text>
<text x="104" y="157" class="mono micro white">Python</text>
<line x1="300" y1="62" x2="300" y2="165" stroke="#26302e"/>
<text x="314" y="83" class="mono label white">02 / MESHYCAL</text>
<text x="314" y="111" class="mono micro muted">LAST PUSH</text>
<text x="392" y="111" class="mono micro mint">1MO AGO</text>
<text x="314" y="134" class="mono micro muted">STARS</text>
<text x="392" y="134" class="mono micro white">0</text>
<text x="314" y="157" class="mono micro muted">LANGUAGE</text>
<text x="392" y="157" class="mono micro white">Python</text>
<line x1="588" y1="62" x2="588" y2="165" stroke="#26302e"/>
<text x="602" y="83" class="mono label white">03 / CHRONICA</text>
<text x="602" y="111" class="mono micro muted">LAST PUSH</text>
<text x="680" y="111" class="mono micro mint">5MO AGO</text>
<text x="602" y="134" class="mono micro muted">STARS</text>
<text x="680" y="134" class="mono micro white">72</text>
<text x="602" y="157" class="mono micro muted">LANGUAGE</text>
<text x="680" y="157" class="mono micro white">TypeScript</text>
<line x1="876" y1="62" x2="876" y2="165" stroke="#26302e"/>
<text x="890" y="83" class="mono label white">04 / FUNDA</text>
<text x="890" y="111" class="mono micro muted">LAST PUSH</text>
<text x="968" y="111" class="mono micro mint">4MO AGO</text>
<text x="890" y="134" class="mono micro muted">STARS</text>
<text x="968" y="134" class="mono micro white">0</text>
<text x="890" y="157" class="mono micro muted">LANGUAGE</text>
<text x="968" y="157" class="mono micro white">TypeScript</text>
</svg>
