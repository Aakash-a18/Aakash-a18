<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="signal-title signal-desc">
<title id="signal-title">Public signal</title>
<desc id="signal-desc">Recent push dates and public repository counts for four selected projects.</desc>
<style>
      .display { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.7px; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .white { fill: #f5f5f2; }
      .muted { fill: #9aa6a2; }
      .ink { fill: #111514; }
      .paper-muted { fill: #5f625e; }
      .mint { fill: #5ef2b2; }
      .red { fill: #f0442e; }
      .amber { fill: #d8a633; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .label { font-size: 15px; font-weight: 650; letter-spacing: 1.15px; }
      .micro { font-size: 13px; font-weight: 550; letter-spacing: .65px; }
      .body { font-size: 18px; }
      .signal { stroke-dasharray: 7 12; animation: signal-flow 12s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: live-pulse 2.4s ease-in-out infinite; }
      @keyframes signal-flow { to { stroke-dashoffset: -190; } }
      @keyframes live-pulse { 0%, 100% { opacity: .55; transform: scale(.84); } 50% { opacity: 1; transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) {
        .signal, .pulse { animation: none !important; }
      }
    </style>
<rect width="1200" height="250" fill="#0a0d0d"/>
<line x1="26" y1="48" x2="1174" y2="48" stroke="#35403d"/>
<text x="28" y="32" class="mono eyebrow mint">PUBLIC SIGNAL / AUTO-REFRESHED</text>
<text x="1172" y="32" class="mono micro muted" text-anchor="end">SYNC 2026.09.01</text>
<line x1="600" y1="66" x2="600" y2="230" stroke="#26302e"/>
<line x1="26" y1="149" x2="1174" y2="149" stroke="#26302e"/>
<text x="28" y="88" class="mono label white">01 / MESHERRA</text>
<text x="568" y="88" class="mono label mint" text-anchor="end">1MO AGO</text>
<text x="28" y="118" class="mono micro muted">STARS  0   ·   LANGUAGE  Python   ·   LAST PUSH  2026.07.10</text>
<text x="626" y="88" class="mono label white">02 / MESHYCAL</text>
<text x="1166" y="88" class="mono label mint" text-anchor="end">2MO AGO</text>
<text x="626" y="118" class="mono micro muted">STARS  0   ·   LANGUAGE  Python   ·   LAST PUSH  2026.06.22</text>
<text x="28" y="176" class="mono label white">03 / CHRONICA</text>
<text x="568" y="176" class="mono label mint" text-anchor="end">5MO AGO</text>
<text x="28" y="206" class="mono micro muted">STARS  72   ·   LANGUAGE  TypeScript   ·   LAST PUSH  2026.03.10</text>
<text x="626" y="176" class="mono label white">04 / FUNDA</text>
<text x="1166" y="176" class="mono label mint" text-anchor="end">4MO AGO</text>
<text x="626" y="206" class="mono micro muted">STARS  0   ·   LANGUAGE  TypeScript   ·   LAST PUSH  2026.04.09</text>
</svg>
