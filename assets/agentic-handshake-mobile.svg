<circle cx="170" cy="338" r="8" fill="none" stroke="#d7ddda"/>
<text x="236" y="343" class="mono label white" text-anchor="middle">AGENT</text>
<polygon points="170,405 207,427 207,463 170,485 133,463 133,427" fill="#081110" stroke="#5ef2b2" stroke-width="1.5"/>
<line x1="170" y1="417" x2="170" y2="473" stroke="#5ef2b2" stroke-width="3"/>
<text x="170" y="514" class="mono label white" text-anchor="middle">AIRLOCK</text>
<circle cx="470" cy="244" r="35" fill="#060909" stroke="#d7ddda"/>
<circle cx="470" cy="244" r="8" fill="none" stroke="#d7ddda"/>
<text x="404" y="249" class="mono label white" text-anchor="middle">HUMAN</text>
<circle cx="470" cy="338" r="35" fill="#060909" stroke="#d7ddda"/>
<circle cx="470" cy="338" r="8" fill="none" stroke="#d7ddda"/>
<text x="404" y="343" class="mono label white" text-anchor="middle">AGENT</text>
<polygon points="470,405 507,427 507,463 470,485 433,463 433,427" fill="#081110" stroke="#5ef2b2" stroke-width="1.5"/>
<line x1="470" y1="417" x2="470" y2="473" stroke="#5ef2b2" stroke-width="3"/>
<text x="470" y="514" class="mono label white" text-anchor="middle">AIRLOCK</text>
