<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="mobile-signal-title mobile-signal-desc">
<title id="mobile-signal-title">Public signal</title>
<desc id="mobile-signal-desc">Recent public activity for four selected repositories.</desc>
<style>
      .display { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.7px; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .white { fill: #f5f5f2; }
      .muted { fill: #9aa6a2; }
      .ink { fill: #111514; }
      .paper-muted { fill: #5f625e; }
      .mint { fill: #5ef2b2; }
      .red { fill: #f0442e; }
      .amber { fill: #d8a633; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .label { font-size: 15px; font-weight: 650; letter-spacing: 1.15px; }
      .micro { font-size: 13px; font-weight: 550; letter-spacing: .65px; }
      .body { font-size: 18px; }
      .signal { stroke-dasharray: 7 12; animation: signal-flow 12s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: live-pulse 2.4s ease-in-out infinite; }
      @keyframes signal-flow { to { stroke-dashoffset: -190; } }
      @keyframes live-pulse { 0%, 100% { opacity: .55; transform: scale(.84); } 50% { opacity: 1; transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) {
        .signal, .pulse { animation: none !important; }
      }
    </style>
<style>.eyebrow{font-size:17px}.label{font-size:17px}.micro{font-size:15px}.body{font-size:18px}</style>
<rect width="640" height="430" fill="#0a0d0d"/>
<text x="24" y="31" class="mono eyebrow mint">PUBLIC SIGNAL / AUTO-REFRESHED</text>
<text x="616" y="31" class="mono micro muted" text-anchor="end">2026.09.03</text>
<line x1="24" y1="48" x2="616" y2="48" stroke="#35403d"/>
<text x="28" y="91" class="mono label white">01 / MESHERRA</text>
<text x="612" y="91" class="mono label mint" text-anchor="end">1MO AGO</text>
<text x="28" y="121" class="mono micro muted">STARS  0   ·   LANGUAGE  Python   ·   PUSH  2026.07.10</text>
<line x1="28" y1="143" x2="612" y2="143" stroke="#26302e"/>
<text x="28" y="179" class="mono label white">02 / MESHYCAL</text>
<text x="612" y="179" class="mono label mint" text-anchor="end">2MO AGO</text>
<text x="28" y="209" class="mono micro muted">STARS  0   ·   LANGUAGE  Python   ·   PUSH  2026.06.22</text>
<line x1="28" y1="231" x2="612" y2="231" stroke="#26302e"/>
<text x="28" y="267" class="mono label white">03 / CHRONICA</text>
<text x="612" y="267" class="mono label mint" text-anchor="end">5MO AGO</text>
<text x="28" y="297" class="mono micro muted">STARS  72   ·   LANGUAGE  TypeScript   ·   PUSH  2026.03.10</text>
<line x1="28" y1="319" x2="612" y2="319" stroke="#26302e"/>
<text x="28" y="355" class="mono label white">04 / FUNDA</text>
<text x="612" y="355" class="mono label mint" text-anchor="end">4MO AGO</text>
<text x="28" y="385" class="mono micro muted">STARS  0   ·   LANGUAGE  TypeScript   ·   PUSH  2026.04.09</text>
<line x1="28" y1="407" x2="612" y2="407" stroke="#26302e"/>
</svg>
