<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" role="img" aria-labelledby="mobile-flight-title mobile-flight-desc">
<title id="mobile-flight-title">Aakash Agrawal — Flight Recorder</title>
<desc id="mobile-flight-desc">Compact mobile research instrument with four public systems, deliberately unnamed private programs, and four research axes.</desc>
<defs>
<pattern id="mobile-dark-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#18201e" stroke-width="0.7"/></pattern>
<pattern id="mobile-paper-grid" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.6" fill="#c8c4ba" opacity="0.7"/></pattern>
<style>
      .display { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.7px; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .white { fill: #f5f5f2; }
      .muted { fill: #9aa6a2; }
      .ink { fill: #111514; }
      .paper-muted { fill: #5f625e; }
      .mint { fill: #5ef2b2; }
      .red { fill: #f0442e; }
      .amber { fill: #d8a633; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .label { font-size: 15px; font-weight: 650; letter-spacing: 1.15px; }
      .micro { font-size: 13px; font-weight: 550; letter-spacing: .65px; }
      .body { font-size: 18px; }
      .signal { stroke-dasharray: 7 12; animation: signal-flow 12s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: live-pulse 2.4s ease-in-out infinite; }
      @keyframes signal-flow { to { stroke-dashoffset: -190; } }
      @keyframes live-pulse { 0%, 100% { opacity: .55; transform: scale(.84); } 50% { opacity: 1; transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) {
        .signal, .pulse { animation: none !important; }
      }
    </style>
</defs>
<style>.eyebrow{font-size:17px}.label{font-size:17px}.micro{font-size:15px}.body{font-size:19px}</style>
<rect width="640" height="500" fill="#060909"/>
<rect width="640" height="500" fill="url(#mobile-dark-grid)" opacity="0.54"/>
<rect y="500" width="640" height="260" fill="#f2f0e9"/>
<rect x="480" y="520" width="140" height="212" fill="url(#mobile-paper-grid)" opacity="0.48"/>
<line x1="24" y1="48" x2="616" y2="48" stroke="#35403d"/>
<text x="26" y="32" class="mono eyebrow white">AA / FLIGHT RECORDER / V2</text>
<circle cx="608" cy="27" r="6" fill="#5ef2b2" class="pulse"/>
<text x="26" y="101" class="display white" font-size="45">AAKASH AGRAWAL</text>
<text x="29" y="139" class="mono body white">Building the trust layer,</text>
<text x="29" y="166" class="mono body white">the delegations, and the</text>
<text x="29" y="193" class="mono body white">instruments to see farther.</text>
<text x="26" y="235" class="mono label muted">LIVE SYSTEMS</text>
<line x1="320" y1="248" x2="320" y2="462" stroke="#5ef2b2" opacity="0.78"/>
<line x1="320" y1="248" x2="320" y2="462" stroke="#5ef2b2" stroke-width="2" class="signal"/>
<circle cx="320" cy="271" r="5" fill="#5ef2b2"/>
<text x="28" y="276" class="mono label white">01 / MESHERRA</text>
<text x="612" y="276" class="mono micro mint" text-anchor="end">1MO AGO</text>
<line x1="336" y1="288" x2="612" y2="288" stroke="#28322f"/>
<circle cx="320" cy="314" r="5" fill="#5ef2b2"/>
<text x="28" y="319" class="mono label white">02 / MESHYCAL</text>
<text x="612" y="319" class="mono micro mint" text-anchor="end">1MO AGO</text>
<line x1="336" y1="331" x2="612" y2="331" stroke="#28322f"/>
<circle cx="320" cy="357" r="5" fill="#5ef2b2"/>
<text x="28" y="362" class="mono label white">03 / CHRONICA</text>
<text x="612" y="362" class="mono micro mint" text-anchor="end">5MO AGO</text>
<line x1="336" y1="374" x2="612" y2="374" stroke="#28322f"/>
<circle cx="320" cy="400" r="5" fill="#5ef2b2"/>
<text x="28" y="405" class="mono label white">04 / FUNDA</text>
<text x="612" y="405" class="mono micro mint" text-anchor="end">4MO AGO</text>
<line x1="336" y1="417" x2="612" y2="417" stroke="#28322f"/>
<circle cx="320" cy="447" r="5" fill="#f0442e"/>
<text x="28" y="453" class="mono label red">03 PRIVATE PROGRAMS</text>
<text x="612" y="453" class="mono micro muted" text-anchor="end">WITHHELD</text>
<text x="26" y="536" class="mono label paper-muted">RESEARCH INDEX</text>
<text x="614" y="536" class="mono micro paper-muted" text-anchor="end">SYNC 2026.08.17</text>
<line x1="26" y1="550" x2="614" y2="550" stroke="#8b8b84"/>
<line x1="320" y1="566" x2="320" y2="706" stroke="#b0ada4"/>
<line x1="26" y1="636" x2="614" y2="636" stroke="#b0ada4"/>
<text x="28" y="594" class="display ink" font-size="34">01</text>
<text x="82" y="590" class="sans label ink">TRUST</text>
<text x="332" y="594" class="display ink" font-size="34">02</text>
<text x="386" y="590" class="sans label ink">DELEGATION</text>
<text x="28" y="680" class="display ink" font-size="34">03</text>
<text x="82" y="676" class="sans label ink">COGNITION</text>
<text x="332" y="680" class="display ink" font-size="34">04</text>
<text x="386" y="676" class="sans label ink">LONG-HORIZON RESEARCH</text>
<line x1="26" y1="724" x2="614" y2="724" stroke="#111514"/>
<text x="320" y="746" class="mono micro ink" text-anchor="middle">DISCLOSE THE QUESTION. PROTECT THE WORK.</text>
</svg>
