name: Refresh public signal

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/profile.json"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Refresh public repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_public_activity.py

      - name: Render profile assets
        run: python scripts/render_profile.py

      - name: Verify generated profile
        run: python -m unittest discover -s tests -v

      - name: Commit changed signals
        run: |
          if git diff --quiet; then
            echo "No public signal changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data/public_activity.json
          git commit -m "chore: refresh public signal [skip ci]"
          git push
